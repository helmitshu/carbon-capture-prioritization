# System libraries for WeasyPrint (PDF screening-memo rendering).
# Installed via apt in the nixpacks setup phase. The memo HTML is text-only
# (no SVG or raster images), so this is the minimal set: Pango/Cairo for
# text layout and rendering, HarfBuzz for text shaping, libffi for cffi,
# libglib for GObject (loaded via cffi at import time), shared-mime-info
# and fontconfig for font discovery.
[phases.setup]
aptPkgs = ["libcairo2", "libpango-1.0-0", "libharfbuzz-subset0", "libffi-dev", "libglib2.0-0", "shared-mime-info", "fontconfig"]
